<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* ==========================================================================
   S.M.A.S.H. — Society of Menstrual Awareness and Sexual Health
   Campus dispenser map. Single-file app: HTML + CSS + JS.
   ========================================================================== */
:root{
  --crimson:#AC2B37;
  --crimson-dark:#7f1f29;
  --ink:#1d1b1c;
  --muted:#6b6566;
  --line:#e8e2e3;
  --bg:#ffffff;
  --soft:#faf6f6;
  --women:#b8336a;
  --men:#2f6fb3;
  --allg:#5b8a3c;
  --unk:#8a7f80;
  --radius:18px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#ddd;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0;z-index:0}

/* ---------- Top bar ---------- */
.topbar{
  position:fixed;z-index:500;left:0;right:0;top:0;
  padding:calc(var(--safe-top) + 10px) calc(var(--safe-r) + 12px) 10px calc(var(--safe-l) + 12px);
  display:flex;gap:8px;align-items:center;pointer-events:none;
}
.brand{
  pointer-events:auto;display:flex;align-items:center;gap:10px;
  background:var(--bg);border-radius:14px;padding:8px 12px 8px 8px;
  box-shadow:0 4px 18px rgba(0,0,0,.18);min-width:0;flex:1;
}
.logo{width:34px;height:34px;border-radius:10px;background:var(--crimson);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;flex:none}
.brand-text{min-width:0}
.brand-text b{display:block;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  pointer-events:auto;flex:none;width:46px;height:46px;border-radius:14px;border:0;background:var(--bg);
  box-shadow:0 4px 18px rgba(0,0,0,.18);display:grid;place-items:center;
}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{transform:scale(.96)}

/* ---------- Bottom controls ---------- */
.fabs{
  position:fixed;z-index:500;right:calc(var(--safe-r) + 12px);bottom:calc(var(--safe-bot) + 18px);
  display:flex;flex-direction:column;gap:10px;
}
.pillbar{
  position:fixed;z-index:500;left:calc(var(--safe-l) + 12px);bottom:calc(var(--safe-bot) + 18px);
  display:flex;gap:8px;
}
.pill{
  border:0;background:var(--crimson);color:#fff;border-radius:999px;padding:13px 18px;font-weight:650;font-size:15px;
  box-shadow:0 6px 18px rgba(172,43,55,.35);display:flex;gap:8px;align-items:center;
}
.pill svg{width:18px;height:18px}
.pill.secondary{background:#fff;color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.18)}

/* ---------- Status toast ---------- */
.toast{
  position:fixed;z-index:700;left:50%;transform:translateX(-50%);
  top:calc(var(--safe-top) + 74px);background:rgba(29,27,28,.92);color:#fff;
  font-size:13px;padding:8px 14px;border-radius:999px;max-width:92vw;text-align:center;
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1}

/* ---------- Building markers ---------- */
.bpin{background:none;border:0}
.bpin .dot{
  position:absolute;left:0;top:0;width:max-content;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:#fff;border:2px solid var(--crimson);color:var(--ink);
  border-radius:999px;padding:4px 10px 4px 4px;font-size:12.5px;font-weight:650;
  box-shadow:0 3px 10px rgba(0,0,0,.28);transform:translate(-14px,-50%);
}
.bpin .count{
  width:22px;height:22px;border-radius:50%;background:var(--crimson);color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none;
}
.bpin.active .dot{background:var(--crimson);color:#fff}
.bpin.active .count{background:#fff;color:var(--crimson)}
.bpin.dim{opacity:.35}
.map-compact .bpin .label{display:none}
.map-compact .bpin .dot{padding:4px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}

/* ---------- Bottom sheet ---------- */
.scrim{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:900;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
  background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.25);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-bot);
}
.sheet.open{transform:translateY(0)}
.grab{padding:8px 0 2px;display:grid;place-items:center;flex:none;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:#d6cfd0;display:block}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px;flex:1}
.closebtn{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#f1ecec;display:grid;place-items:center;z-index:2}
.closebtn svg{width:16px;height:16px}

.hero{
  position:relative;margin:6px -16px 0;height:170px;background:linear-gradient(135deg,var(--crimson),#d65a5a);
  overflow:hidden;
}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0) 60%)}
.hero .ttl{position:absolute;left:16px;right:16px;bottom:12px;color:#fff}
.hero .ttl h2{margin:0;font-size:24px;line-height:1.1}
.hero .ttl p{margin:4px 0 0;font-size:13px;opacity:.9}
.hero.noimg{height:auto;padding:22px 16px 14px;margin-top:0;border-radius:0}
.hero.noimg .shade{display:none}
.hero.noimg .ttl{position:static}

.actions{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.chipbtn{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;
  display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)
}
.chipbtn svg{width:15px;height:15px}

.group{margin-top:18px}
.group h3{
  margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.group h3 .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.room{
  border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:8px;
  display:flex;gap:12px;align-items:flex-start;background:#fff;position:relative;overflow:hidden;
}
.room::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--unk))}
.room .main{flex:1;min-width:0}
.room .where{font-size:16px;font-weight:700}
.room .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--soft);border:1px solid #f0e4e5;color:var(--crimson-dark)}
.tag.warn{background:#fff6e5;border-color:#f3dfb3;color:#8a5a00}
.thumbs{display:flex;gap:6px;flex:none}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee;border:1px solid var(--line);display:block}
.thumbbtn{padding:0;border:0;background:none;position:relative}
.thumbbtn .more{position:absolute;inset:0;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;font-weight:700;display:grid;place-items:center}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px;text-align:center;margin-top:16px}
.foot{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
.foot a{color:var(--crimson)}

/* ---------- List view ---------- */
.search{
  position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 10px;
}
.search input{
  width:100%;font-size:16px;/* 16px stops iOS zoom-on-focus */padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);outline:none
}
.search input:focus{border-color:var(--crimson);background:#fff}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
.brow{
  width:100%;text-align:left;border:0;background:none;padding:12px 2px;border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;
}
.brow .n{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--crimson);font-weight:800;display:grid;place-items:center;flex:none}
.brow .t{flex:1;min-width:0}
.brow .t b{display:block;font-size:15.5px}
.brow .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.brow .d{font-size:12.5px;color:var(--muted);flex:none}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- Lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.97);display:none;flex-direction:column}
.lightbox.show{display:flex}
.lightbox .lb-top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(var(--safe-top) + 10px) 14px 10px}
.lightbox .lb-top button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600}
.lightbox .lb-img{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lightbox .lb-cap{color:#ddd;text-align:center;font-size:14px;padding:10px 16px calc(var(--safe-bot) + 16px)}
.lightbox .lb-nav{display:flex;justify-content:center;gap:10px;padding-bottom:8px}

/* ---------- Setup (pin placement) mode ---------- */
.setupbar{
  position:fixed;z-index:600;left:12px;right:12px;bottom:calc(var(--safe-bot) + 84px);
  background:#1d1b1c;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;display:none;
  box-shadow:0 6px 24px rgba(0,0,0,.3)
}
.setupbar.show{display:block}
.setupbar code{background:#333;padding:2px 6px;border-radius:6px;font-size:13px}
.setupbar button{margin-top:8px;border:0;border-radius:999px;padding:7px 12px;font-weight:600;background:var(--crimson);color:#fff}

.leaflet-control-attribution{font-size:9px}
.leaflet-bottom.leaflet-left{margin-bottom:calc(var(--safe-bot) + 70px)}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>

<div id="map" aria-label="Map of WPI campus"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">SM</div>
    <div class="brand-text">
      <b>Free Period Products @ WPI</b>
      <small id="statusLine">Loading dispensers…</small>
    </div>
  </div>
  <button class="iconbtn" id="infoBtn" aria-label="About this map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
  </button>
</header>

<div class="pillbar">
  <button class="pill" id="listBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    All buildings
  </button>
</div>

<div class="fabs">
  <button class="iconbtn" id="layerBtn" aria-label="Switch between satellite and street map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
  </button>
  <button class="iconbtn" id="locBtn" aria-label="Show where I am and sort by distance">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="setupbar" id="setupbar"></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab" id="grab"><i></i></div>
  <button class="closebtn" id="closeBtn" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Product photo">
  <div class="lb-top"><span id="lbCount"></span><button id="lbClose">Done</button></div>
  <div class="lb-img"><img id="lbImg" alt=""></div>
  <div class="lb-nav" id="lbNav"></div>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
/* ==========================================================================
   1. CONFIGURATION — the only part most people will ever need to edit.
   ========================================================================== */
const CONFIG = {
  // The Google Sheet the exec board edits. It must be shared as
  // "Anyone with the link → Viewer" so the map can read it.
  SHEET_ID: "1LWNBU7ozqGbJ-IFksT6O-W7O18ImZS4eFxxZDyLUEzA",

  // Tab that lists every restroom with a dispenser (gid=0 is the first tab).
  RESTROOMS_GID: "0",

  // OPTIONAL second tab that fixes pin positions and adds building photos.
  // Columns: Building | Lat | Lng | Photo URL | Category. If the tab doesn't
  // exist yet, the map just uses the built-in positions below.
  BUILDINGS_TAB_NAME: "Buildings",

  // OPTIONAL link students can tap to report an empty or broken dispenser
  // (e.g., a Google Form). Leave "" to hide the button.
  REPORT_URL: "",

  // Shown in the About panel.
  CLUB_NAME: "S.M.A.S.H. — Society of Menstrual Awareness and Sexual Health",
  CLUB_CONTACT: "",          // e.g. "smash@wpi.edu" or an Instagram link

  // Map start position (WPI main campus).
  CENTER: [42.27445, -71.80760],
  ZOOM: 17,
};

/* ==========================================================================
   2. BUILT-IN BUILDING POSITIONS
   Approximate pin locations for WPI academic + athletic buildings. Anything
   in the optional "Buildings" tab overrides these. Use #setup mode (add
   #setup to the end of the URL) to find exact coordinates by dragging pins.
   ========================================================================== */
const DEFAULT_BUILDINGS = {
  "Atwater Kent Laboratories":   {lat:42.27537, lng:-71.80649, cat:"Academic", aliases:["atwater kent","ak","atwater kent labs"]},
  "Boynton Hall":                {lat:42.27396, lng:-71.80713, cat:"Academic", aliases:["boynton"]},
  "Rubin Campus Center":         {lat:42.27424, lng:-71.80838, cat:"Academic", aliases:["campus center","rcc","rubin"]},
  "Daniels Hall":                {lat:42.27378, lng:-71.80948, cat:"Academic", aliases:["daniels"]},
  "Foisie Innovation Studio":    {lat:42.27308, lng:-71.80795, cat:"Academic", aliases:["innovation studio","foisie","fis"]},
  "Fuller Laboratories":         {lat:42.27500, lng:-71.80590, cat:"Academic", aliases:["fuller labs","fuller","fl"]},
  "Goddard Hall":                {lat:42.27522, lng:-71.80876, cat:"Academic", aliases:["goddard"]},
  "Gordon Library":              {lat:42.27447, lng:-71.80628, cat:"Academic", aliases:["library","gordon"]},
  "Harrington Auditorium":       {lat:42.27358, lng:-71.80856, cat:"Athletic", aliases:["harrington"]},
  "Higgins Laboratories":        {lat:42.27452, lng:-71.80885, cat:"Academic", aliases:["higgins labs","higgins","hl"]},
  "Kaven Hall":                  {lat:42.27395, lng:-71.80605, cat:"Academic", aliases:["kaven","kh"]},
  "Olin Hall":                   {lat:42.27490, lng:-71.80800, cat:"Academic", aliases:["olin","oh"]},
  "Global Project Center":       {lat:42.27565, lng:-71.80570, cat:"Academic", aliases:["project center","laurie a leshin global project center","leshin project center"]},
  "Sports & Recreation Center":  {lat:42.27320, lng:-71.80930, cat:"Athletic", aliases:["sports and recreation center","rec center","sports and rec","sports & rec","the rec"]},
  "Salisbury Laboratories":      {lat:42.27490, lng:-71.80700, cat:"Academic", aliases:["salisbury labs","salisbury","sl"]},
  "Stratton Hall":               {lat:42.27433, lng:-71.80689, cat:"Academic", aliases:["stratton","sh"]},
  "Washburn Shops":              {lat:42.27376, lng:-71.80672, cat:"Academic", aliases:["washburn","washburn shops/stoddard laboratories","wb"]},
  "Unity Hall":                  {lat:42.27250, lng:-71.80600, cat:"Academic", aliases:["unity"]},
  "Alden Memorial":              {lat:42.27470, lng:-71.80950, cat:"Academic", aliases:["alden","alden hall"]},
};

/* ==========================================================================
   3. FALLBACK DATA — a snapshot of the sheet, used only if the live sheet
   can't be reached (no signal, sheet not shared, etc.). Optional to update.
   ========================================================================== */
const FALLBACK_CSV = `Building,Location,Available Resources
Atwater Kent,1,Pads and Tampons
Boynton Hall,Basement,Pads and Tampons
Rubin Campus Center,Main,Pads and Tampons
Daniels Hall,1,Pads and Tampons
Foisie Innovation Studio,1,Pads and Tampons
Fuller Labs,1,Pads and Tampons
Goddard Hall,1,Pads and Tampons
Gordon Library,2,Pads and Tampons
Harrington Auditorium,2,Pads and Tampons
Higgins Labs,1,Pads and Tampons
Kaven Hall,2,Pads and Tampons
Olin Hall,1,Pads and Tampons
Project Center,1,Pads and Tampons
Sports and Recreation Center,3 & 4 girls locker rooms,Pads and Tampons
Salisbury Labs,1 & 3,Pads and Tampons
Stratton Hall,1,Pads and Tampons
Washburn,1& 2,Pads and Tampons`;

/* ==========================================================================
   4. CODE — no need to edit below this line.
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
const slug = s => norm(s).replace(/ /g,"-");
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};

/* ---------- CSV parsing (handles quotes, commas and newlines in cells) ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = String(text).replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(cell); rows.push(row); row=[]; cell="";
    }else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==""));
}

/* Flexible header matching so the sheet's column names can vary a bit. */
const FIELD_ALIASES = {
  building: ["building","building name","hall","name"],
  floor:    ["floor","level","location","floor level","floors"],
  room:     ["room","room number","restroom","bathroom","restroom location","bathroom location","where","room location","directions"],
  type:     ["restroom type","bathroom type","type","gender","restroom gender","bathroom gender"],
  products: ["products","available resources","resources","available products","product"],
  photos:   ["photo","photos","photo url","photo urls","product photo","product photos","image","images","picture","pictures","product image"],
  notes:    ["notes","note","comments","details"],
  status:   ["status","stocked","dispenser status"],
  checked:  ["last checked","last updated","updated","checked","date checked"],
  lat:      ["lat","latitude"],
  lng:      ["lng","lon","long","longitude"],
  bphoto:   ["building photo","building photo url","building image"],
  cat:      ["category","building type","kind"],
  hidden:   ["hide","hidden"],
};
function mapHeaders(header){
  const idx={};
  const H=header.map(h=>norm(h));
  for(const [field,names] of Object.entries(FIELD_ALIASES)){
    for(const n of names){ const i=H.indexOf(norm(n)); if(i>-1 && !(field in idx)){ idx[field]=i; break; } }
  }
  // A Buildings tab's photo column is the building photo.
  return idx;
}
function rowsToObjects(rows){
  if(!rows.length) return {fields:{},items:[]};
  const fields=mapHeaders(rows[0]);
  const items=rows.slice(1).map(r=>{
    const o={}; for(const [f,i] of Object.entries(fields)) o[f]=(r[i]??"").trim(); return o;
  });
  return {fields,items};
}

/* ---------- Building name matching ---------- */
const buildingIndex = new Map(); // normalized name/alias -> canonical
function indexBuilding(name, aliases=[]){
  buildingIndex.set(norm(name), name);
  aliases.forEach(a=>buildingIndex.set(norm(a), name));
}
Object.entries(DEFAULT_BUILDINGS).forEach(([n,b])=>indexBuilding(n,b.aliases));
function canonicalBuilding(raw){
  const n=norm(raw); if(!n) return "";
  if(buildingIndex.has(n)) return buildingIndex.get(n);
  // Loose match: "Fuller Labs (upper)" -> Fuller Laboratories
  for(const [k,v] of buildingIndex){ if(k.length>3 && (n.startsWith(k+" ")||n===k)) return v; }
  return String(raw).trim(); // unknown building: keep as typed
}

/* ---------- Interpreting a restroom row ---------- */
const TYPES = {
  women:{label:"Women’s restrooms", short:"Women’s", color:"var(--women)", hex:"#b8336a"},
  men:  {label:"Men’s restrooms",   short:"Men’s",   color:"var(--men)",   hex:"#2f6fb3"},
  allg: {label:"All-gender restrooms", short:"All-gender", color:"var(--allg)", hex:"#5b8a3c"},
  unk:  {label:"Restroom type not listed yet", short:"Not listed", color:"var(--unk)", hex:"#8a7f80"},
};
const TYPE_ORDER=["women","men","allg","unk"];
function detectType(text, strict){
  // strict=true for a dedicated "Restroom Type" column, where single letters (W / M / A) are allowed.
  const t=" "+norm(text)+" ";
  if(/ (all gender|allgender|gender neutral|gender inclusive|unisex|family|single user|single stall|universal|non binary) /.test(t) || (strict && / (a|ag|n|nb|all) /.test(t))) return "allg";
  if(/ (women|womens|woman|female|girls|girl|ladies) /.test(t) || (strict && / (w|f) /.test(t))) return "women";
  if(/ (men|mens|man|male|boys|boy) /.test(t) || (strict && / m /.test(t))) return "men";
  return "unk";
}
function floorLabel(raw){
  const s=String(raw||"").trim(); if(!s) return "";
  if(/^\d+$/.test(s)) return `Floor ${s}`;
  if(/^\d+\s*(&|and|,|\/)\s*\d+/i.test(s)){
    const nums=s.match(/\d+/g); const rest=s.replace(/^[\d\s&,\/]+(and\s+\d+)?/i,"").trim();
    const base=`Floors ${nums.slice(0,-1).join(", ")} & ${nums.at(-1)}`;
    return rest ? `${base} · ${rest}` : base;
  }
  if(/^(b|basement|ll|lower level)$/i.test(s)) return "Basement / Lower level";
  if(/^(main|g|ground)$/i.test(s)) return "Main floor";
  return s;
}
function splitProducts(s){
  return String(s||"").split(/\s*(?:,|;|\/|\+|&|\band\b)\s*/i).map(x=>x.trim()).filter(Boolean)
    .map(x=>x.charAt(0).toUpperCase()+x.slice(1));
}
function photoURL(u){
  u=String(u||"").trim(); if(!u) return "";
  // Google Drive share links -> direct image thumbnails.
  let m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/) || u.match(/docs\.google\.com\/uc\?(?:.*&)?id=([\w-]+)/);
  if(m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  if(/^https?:\/\//i.test(u)) return u;
  return "";
}
function splitPhotos(s){ return String(s||"").split(/[\s,;|]+/).map(photoURL).filter(Boolean); }

/* ---------- State ---------- */
let BUILDINGS = {}; // canonical -> {name, lat, lng, cat, photo, rooms:[]}
let markers = {};
let myPos = null;
let activeFilter = "all";
let source = "live";

function buildModel(restroomCSV, buildingsCSV){
  const model={};
  const ensure = name => {
    if(!model[name]){
      const d=DEFAULT_BUILDINGS[name]||{};
      model[name]={name, lat:d.lat, lng:d.lng, cat:d.cat||"", photo:"", rooms:[]};
    }
    return model[name];
  };
  // Buildings tab (optional): overrides positions + adds photos
  if(buildingsCSV){
    const {fields,items}=rowsToObjects(parseCSV(buildingsCSV));
    // Only trust it if it really is a Buildings tab (has lat/lng). Google returns
    // the first tab when a tab name doesn't exist, so this check matters.
    if("lat" in fields && "lng" in fields){
      items.forEach(it=>{
        if(!it.building) return;
        const name=canonicalBuilding(it.building);
        if(!buildingIndex.has(norm(name))) indexBuilding(name);
        const b=ensure(name);
        const la=parseFloat(it.lat), ln=parseFloat(it.lng);
        if(isFinite(la)&&isFinite(ln)){ b.lat=la; b.lng=ln; }
        const ph=photoURL(it.photos||it.bphoto); if(ph) b.photo=ph;
        if(it.cat) b.cat=it.cat;
        b.listed=true;
      });
    }
  }
  const {items}=rowsToObjects(parseCSV(restroomCSV));
  items.forEach((it,i)=>{
    if(!it.building) return;
    if(/^(y|yes|true|x|1)$/i.test(it.hidden||"")) return;
    const name=canonicalBuilding(it.building);
    const b=ensure(name);
    if(it.bphoto && !b.photo) b.photo=photoURL(it.bphoto);
    const typeRaw = it.type || "";
    const type = typeRaw ? detectType(typeRaw,true) : detectType([it.floor, it.room, it.notes].join(" "),false);
    b.rooms.push({
      floor: floorLabel(it.floor),
      room: it.room||"",
      type,
      typeText: typeRaw,
      products: splitProducts(it.products||""),
      photos: splitPhotos(it.photos),
      notes: it.notes||"",
      status: it.status||"",
      checked: it.checked||"",
      order:i,
    });
  });
  // Only show buildings that have at least one dispenser OR were explicitly listed in the Buildings tab.
  Object.keys(model).forEach(k=>{ if(!model[k].rooms.length && !model[k].listed) delete model[k]; });
  return model;
}

/* ---------- Data loading ---------- */
function sheetCSVUrl(opts){
  const base=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv`;
  return opts.gid!=null ? `${base}&gid=${opts.gid}` : `${base}&sheet=${encodeURIComponent(opts.sheet)}`;
}
async function fetchText(url, ms=9000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(url+"&_="+Date.now(),{signal:ctl.signal, cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const txt=await r.text();
    if(/^\s*<(!doctype|html)/i.test(txt)) throw new Error("Sheet is not shared publicly");
    return txt;
  } finally { clearTimeout(t); }
}
async function loadData(){
  let rest=null, bld=null;
  try{
    [rest,bld]=await Promise.all([
      fetchText(sheetCSVUrl({gid:CONFIG.RESTROOMS_GID})),
      fetchText(sheetCSVUrl({sheet:CONFIG.BUILDINGS_TAB_NAME})).catch(()=>null),
    ]);
    store.set("smash-cache",{rest,bld,at:Date.now()});
    source="live";
  }catch(e){
    console.warn("Live sheet unavailable:",e);
    const c=store.get("smash-cache");
    if(c&&c.rest){ rest=c.rest; bld=c.bld; source="cache:"+c.at; }
    else { rest=FALLBACK_CSV; source="fallback"; }
  }
  return buildModel(rest,bld);
}

function markerHTML(b,active){
  const n=b.rooms.length;
  return `<div class="dot"><span class="count">${n}</span><span class="label">${esc(shortName(b.name))}</span></div>`;
}
function shortName(n){
  return n.replace("Laboratories","Labs").replace("Sports & Recreation Center","Rec Center")
          .replace("Foisie Innovation Studio","Innovation Studio").replace("Rubin Campus Center","Campus Center");
}
function drawMarkers(){
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  const setup = location.hash==="#setup";
  Object.values(BUILDINGS).forEach(b=>{
    if(!isFinite(b.lat)||!isFinite(b.lng)) return;
    const icon=L.divIcon({className:"bpin",html:markerHTML(b),iconSize:[0,0]});
    const m=L.marker([b.lat,b.lng],{icon,draggable:setup,keyboard:true,title:b.name,riseOnHover:true}).addTo(map);

}
function setActiveMarker(name){
  Object.entries(markers).forEach(([n,m])=>{ const el=m.getElement(); if(el) el.classList.toggle("active",n===name); });
}
function applyFilterToMarkers(){
  Object.entries(markers).forEach(([n,m])=>{
    const el=m.getElement(); if(!el) return;
    el.classList.toggle("dim", !matchesFilter(BUILDINGS[n]));
  });
}
function matchesFilter(b){
  if(activeFilter==="all") return true;
  if(activeFilter==="Athletic"||activeFilter==="Academic") return (b.cat||"Academic")===activeFilter;
  return b.rooms.some(r=>r.type===activeFilter);
}

(function(){

  const start=e=>{ if(e.target.closest("#grab")||body.scrollTop<=0){ y0=e.touches[0].clientY; dy=0; sh.style.transition="none"; } };
  const move=e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); if(dy>0){ sh.style.transform=`translateY(${dy}px)`; if(e.cancelable && !e.target.closest("#grab") ) {} } };

};

function openBuilding(name){
  const b=BUILDINGS[name]; if(!b) return;
  setActiveMarker(name);
  if(isFinite(b.lat)) map.flyTo([b.lat - 0.00055, b.lng], Math.max(map.getZoom(),18), {duration:.5});
  const groups={}; b.rooms.forEach(r=>(groups[r.type]=groups[r.type]||[]).push(r));
  const dist = myPos&&isFinite(b.lat) ? ` · ${fmtDist(distance(myPos,[b.lat,b.lng]))} away` : "";
  const sub = `${b.rooms.length} restroom${b.rooms.length===1?"":"s"} with free products${dist}`;
  let html = b.photo
    ? `<div class="hero"><img src="${esc(b.photo)}" alt="${esc(b.name)}" onerror="this.closest('.hero').classList.add('noimg');this.remove()"><div class="shade"></div><div class="ttl"><h2 id="sheetTitle">${esc(b.name)}</h2><p>${sub}</p></div></div>`
    : `<div class="hero noimg"><div class="ttl"><h2 id="sheetTitle">${esc(b.name)}</h2><p>${sub}</p></div></div>`;

  html += `<div class="actions">`;
  if(isFinite(b.lat)) html += `<a class="chipbtn" href="https://maps.apple.com/?daddr=${b.lat},${b.lng}&dirflg=w" target="_blank" rel="noopener">${ICONS.walk}Walk here</a>`;
  html += `<button class="chipbtn" data-share="${esc(name)}">${ICONS.share}Share</button>`;
  if(CONFIG.REPORT_URL) html += `<a class="chipbtn" href="${esc(CONFIG.REPORT_URL)}" target="_blank" rel="noopener">${ICONS.flag}Report empty</a>`;
  html += `</div>`;

  if(!b.rooms.length){
    html += `<div class="empty">No dispensers listed for this building yet.</div>`;
  }
  TYPE_ORDER.forEach(t=>{
    const list=groups[t]; if(!list) return;
    const T=TYPES[t];
    html += `<div class="group"><h3><span class="sw" style="background:${T.color}"></span>${T.label}</h3>`;
    list.forEach((r,ri)=>{
      const where = r.room ? esc(r.room) : esc(r.floor||"Location not specified");
      const sub = r.room && r.floor ? esc(r.floor) : "";
      const tags = r.products.map(p=>`<span class="tag">${esc(p)}</span>`).join("")
        + (r.status && !/^(yes|stocked|ok|good|full)$/i.test(r.status) ? `<span class="tag warn">${esc(r.status)}</span>` : "");
      const pid = `${slug(name)}|${t}|${ri}`;
      let thumbs="";
      if(r.photos.length){
        thumbs=`<div class="thumbs"><button class="thumbbtn" data-photos="${esc(pid)}" aria-label="View ${r.photos.length} product photo${r.photos.length>1?"s":""}"><img class="thumb" loading="lazy" src="${esc(r.photos[0])}" alt="Products in this dispenser">${r.photos.length>1?`<span class="more">+${r.photos.length-1}</span>`:""}</button></div>`;
        photoSets[pid]={urls:r.photos, cap:`${b.name} — ${r.room||r.floor}`};
      }
      html += `<div class="room" style="--c:${T.color}"><div class="main">
          <div class="where">${where}</div>
          ${sub?`<div class="sub">${sub}</div>`:""}
          ${tags?`<div class="tags">${tags}</div>`:""}
          ${r.notes?`<div class="sub" style="margin-top:8px">${esc(r.notes)}</div>`:""}
          ${r.checked?`<div class="sub" style="margin-top:6px;font-size:12px">Last checked ${esc(r.checked)}</div>`:""}
        </div>${thumbs}</div>`;
    });
    html += `</div>`;
  });
  html += footerHTML();
  openSheet(html,"building");
  history.replaceState(null,"","#"+slug(name));
}

function renderList(){
  const q=norm($("#q")?.value||"");
  let list=Object.values(BUILDINGS).filter(matchesFilter)
    .filter(b=>!q || norm(b.name).includes(q) || [...buildingIndex].some(([k,v])=>v===b.name&&k.includes(q)));
  if(myPos) list.sort((a,b)=>distance(myPos,[a.lat,a.lng])-distance(myPos,[b.lat,b.lng]));
  else list.sort((a,b)=>a.name.localeCompare(b.name));
  $("#blist").innerHTML = list.length ? list.map(b=>{
    const types=[...new Set(b.rooms.map(r=>r.type))].sort((x,y)=>TYPE_ORDER.indexOf(x)-TYPE_ORDER.indexOf(y));
    const floors=[...new Set(b.rooms.map(r=>r.floor).filter(Boolean))].join(" · ");
    const d=myPos&&isFinite(b.lat)?fmtDist(distance(myPos,[b.lat,b.lng])):"";
    return `<button class="brow" data-b="${esc(b.name)}"><span class="n">${b.rooms.length}</span>
      <span class="t"><b>${esc(b.name)}<span class="dots">${types.map(t=>`<i title="${TYPES[t].short}" style="background:${TYPES[t].color}"></i>`).join("")}</span></b>
      <small>${esc(floors||"No locations listed")}${b.cat?" · "+esc(b.cat):""}</small></span>
      <span class="d">${d}</span></button>`;
  }).join("") : `<div class="empty">No buildings match.</div>`;
}

/* ---------- Location ---------- */
let meMarker=null;
function distance(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtDist(m){ // walking-time estimate is more useful than meters between classes
  const min=Math.max(1,Math.round(m/80));
  return m>3000 ? "far" : `${min} min walk`;
}
$("#locBtn").onclick=()=>{
  if(!navigator.geolocation){ toast("Location isn’t available on this device"); return; }
  toast("Finding you…");
  navigator.geolocation.getCurrentPosition(p=>{
    myPos=[p.coords.latitude,p.coords.longitude];
    if(meMarker) map.removeLayer(meMarker);
    meMarker=L.marker(myPos,{icon:L.divIcon({className:"",html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(map);
    const nearest=Object.values(BUILDINGS).filter(b=>isFinite(b.lat)&&matchesFilter(b))
      .sort((a,b)=>distance(myPos,[a.lat,a.lng])-distance(myPos,[b.lat,b.lng]))[0];
    if(nearest && distance(myPos,[nearest.lat,nearest.lng])<3000){
      map.flyTo(myPos,18,{duration:.6});
      toast(`Closest: ${nearest.name} · ${fmtDist(distance(myPos,[nearest.lat,nearest.lng]))}`);
    } else {
      toast("You’re off campus — showing campus");
      map.flyTo(CONFIG.CENTER,CONFIG.ZOOM);
    }
    if(sheetMode==="list") renderList();
  },err=>{
    toast(err.code===1?"Location permission was denied":"Couldn’t get your location");
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
};

/* ---------- About ---------- */
$("#infoBtn").onclick=()=>{
  const counts=TYPE_ORDER.map(t=>[t,Object.values(BUILDINGS).reduce((n,b)=>n+b.rooms.filter(r=>r.type===t).length,0)]).filter(([,n])=>n);
  openSheet(`<h2 id="sheetTitle" style="margin:4px 0 8px;font-size:22px">About this map</h2>
    <p style="line-height:1.55;margin:0 0 12px">Free pads and tampons are stocked in restrooms across WPI’s academic buildings and athletic facilities. Tap a building on the map to see which restrooms have a dispenser, sorted by restroom type.</p>
    <div class="tags" style="margin-bottom:14px">${counts.map(([t,n])=>`<span class="tag" style="color:${TYPES[t].color}">${n} ${TYPES[t].short}</span>`).join("")}</div>
    <p style="line-height:1.55;margin:0 0 12px;color:var(--muted);font-size:14px"><b style="color:var(--ink)">Tip:</b> In Safari, tap Share → <i>Add to Home Screen</i> to keep this map one tap away.</p>
    ${CONFIG.REPORT_URL?`<p><a class="chipbtn" href="${esc(CONFIG.REPORT_URL)}" target="_blank" rel="noopener">${ICONS.flag}Report an empty or broken dispenser</a></p>`:""}
    <p class="foot">${esc(CONFIG.CLUB_NAME)}${CONFIG.CLUB_CONTACT?` · ${esc(CONFIG.CLUB_CONTACT)}`:""}<br>Pin positions are approximate. Map imagery © Esri / © OpenStreetMap contributors.</p>`,"about");
};

/* ---------- Setup mode (#setup): drag pins to get exact coordinates ---------- */
function showSetup(b,m){
  const ll=m.getLatLng(); const line=`${b.name}\t${ll.lat.toFixed(6)}\t${ll.lng.toFixed(6)}`;
  const bar=$("#setupbar"); bar.classList.add("show");
  bar.innerHTML=`<b>${esc(b.name)}</b><br>Lat <code>${ll.lat.toFixed(6)}</code> &nbsp; Lng <code>${ll.lng.toFixed(6)}</code><br>
    <button id="copyLL">Copy row for the Buildings tab</button>`;
  $("#copyLL").onclick=async()=>{ try{ await navigator.clipboard.writeText(line); toast("Copied — paste into the Buildings tab"); }catch(e){ toast(line); } };
}
function enterSetupIfNeeded(){
  if(location.hash!=="#setup") return;
  const bar=$("#setupbar"); bar.classList.add("show");
  bar.innerHTML=`<b>Setup mode</b> — drag each pin onto its building, then copy its row into the <b>Buildings</b> tab of the sheet. Tap anywhere on the map to read coordinates.`;
  map.on("click",e=>{ bar.innerHTML=`Tapped: Lat <code>${e.latlng.lat.toFixed(6)}</code> Lng <code>${e.latlng.lng.toFixed(6)}</code>`; });
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }

/* ---------- Deep links: #kaven-hall opens that building (great for QR codes) ---------- */
function openFromHash(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h||h==="setup") return;
  const n=canonicalBuilding(h.replace(/-/g," "));
  const hit=Object.keys(BUILDINGS).find(k=>slug(k)===h||k===n);
  if(hit) openBuilding(hit);
}
window.addEventListener("hashchange",()=>{ if(location.hash==="#setup") location.reload(); else openFromHash(); });

/* ---------- Boot ---------- */
let firstLoad=true;
async function refresh(){
  BUILDINGS=await loadData();
  drawMarkers();
  const total=Object.values(BUILDINGS).reduce((n,b)=>n+b.rooms.length,0);
  const nb=Object.keys(BUILDINGS).length;
  $("#statusLine").textContent = source==="live"
    ? `${total} restrooms · ${nb} buildings · tap a pin`
    : source==="fallback" ? `${total} restrooms · offline copy` : `${total} restrooms · offline (saved)`;
  const pinned=Object.values(BUILDINGS).filter(b=>isFinite(b.lat));
  if(firstLoad && pinned.length && !location.hash) map.fitBounds(L.latLngBounds(pinned.map(b=>[b.lat,b.lng])).pad(0.12),{maxZoom:18});
  // keep an open building in sync after a background refresh
  const open=document.querySelector("#sheetTitle")?.textContent;
  if(sheetMode==="building" && BUILDINGS[open]) openBuilding(open);
  firstLoad=false;
}
refresh().then(()=>{ enterSetupIfNeeded(); openFromHash(); });
// Re-check the sheet when the student comes back to the tab (e.g. reopening from the home screen).
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && sheetMode!=="list") refresh(); });
</script>
